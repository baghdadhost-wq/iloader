name: Publish release from finished builds

# Pushing to the "release" branch publishes the artifacts of already finished
# workflow runs as a GitHub release. The run IDs and the tag live in
# release-runs.txt; the release tag is created by this job.
on:
  push:
    branches:
      - release

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl out
          while read -r run; do
            [ -z "$run" ] && continue
            case "$run" in \#*|tag:*) continue ;; esac
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --dir "dl/$run"
          done < .github/release-runs.txt
          find dl -type f | sort

      - name: Collect files
        run: |
          for dir in dl/*/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -type f | wc -l)
            if [ "$count" -eq 1 ]; then
              f=$(find "$dir" -type f)
              case "$name" in
                iloader-ios-unsigned) cp "$f" "out/iloader-ios-unsigned.ipa" ;;
                *) cp "$f" "out/$(basename "$f")" ;;
              esac
            else
              (cd "$dir" && zip -qr "$OLDPWD/out/$name.zip" .)
            fi
          done
          ls -la out

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(sed -n 's/^tag: *//p' .github/release-runs.txt)
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "iloader for iPad (Wi-Fi + pairing without a computer) — $TAG" \
            --notes-file .github/release-notes.md
